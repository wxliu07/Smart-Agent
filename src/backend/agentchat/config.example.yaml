# Copy this file to config.yaml and fill in your local values.
# Never commit config.yaml with real API keys or passwords.

server:
  host: "127.0.0.1"
  port: 7860
  project_name: "AgentChat"
  version: "2.3.0"

mysql:
  endpoint: "mysql+pymysql://root:change-this-password@localhost:3306/agentchat"
  async_endpoint: "mysql+aiomysql://root:change-this-password@localhost:3306/agentchat"

redis:
  endpoint: "redis://localhost:6379"

multi_models:
  conversation_model:
    api_key: "your-model-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-plus"
  tool_call_model:
    api_key: "your-model-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-plus"
  reasoning_model:
    api_key: "your-reasoning-model-api-key"
    base_url: "https://api.deepseek.com/v1"
    model_name: "deepseek-reasoner"
  text2image:
    api_key: "your-text2image-api-key"
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis"
    model_name: "wanx2.0-t2i-turbo"
  qwen_vl:
    api_key: "your-vision-model-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-vl-plus"
  embedding:
    api_key: "your-embedding-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "text-embedding-v4"
  rerank:
    api_key: "your-rerank-api-key"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "gte-rerank-v2"

tools:
  weather:
    api_key: "your-amap-api-key"
    endpoint: "https://restapi.amap.com/v3/weather/weatherInfo?parameters"
  tavily:
    api_key: "your-tavily-api-key"
  google:
    api_key: "your-serpapi-api-key"
  delivery:
    api_key: ""
    endpoint: "https://qyexpress.market.alicloudapi.com/composite/queryexpress"
  bocha:
    api_key: "your-bocha-api-key"
    endpoint: "https://api.bochaai.com/v1/web-search"

rag:
  enable_summary: true
  enable_elasticsearch: true
  retrival:
    top_k: 5
    min_score: 0.2
  split:
    chunk_size: 500
    overlap_size: 100
  elasticsearch:
    hosts: "http://127.0.0.1:9200"
  vector_db:
    host: "127.0.0.1"
    port: "19530"
    mode: "chroma"

aliyun_oss:
  access_key_id: ""
  access_key_secret: ""
  endpoint: "oss-cn-beijing.aliyuncs.com"
  bucket_name: ""
  base_url: ""

default_config:
  mcp_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/mcp/mcp.png"
  tool_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/default.png"
  agent_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/bot.png"
  mars_daily_url: "https://news.aibase.com/zh/news"
  memory_collection_name: "memory"

wechat_config:
  token: ""
  app_id: ""
  secret: ""

langfuse:
  trace_name: "agentchat"
  host: "https://cloud.langfuse.com"
  public_key: ""
  secret_key: ""
  user_id: ""

whitelist_paths:
  - "/health"
  - "/docs"
  - "/openapi.json"
  - "/api/v1/user/login"
  - "/api/v1/user/register"
